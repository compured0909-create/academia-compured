<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050811" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>COMPURED y Compucenter — Portal de Acceso</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 1.75rem;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .login-brand img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .login-brand h1 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--white);
    }
    .login-brand p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .whatsapp-contact-box {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
    }
    .btn-whatsapp-contacto {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      background: #16a34a;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-whatsapp-contacto:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="login-brand">
        <img src="logo.png" alt="Logo COMPURED y Compucenter" />
        <h1>COMPURED &amp; Compucenter</h1>
        <p>Acceso al sistema académico y administrativo</p>
      </div>

      <form id="formLogin" onsubmit="iniciarSesionForm(event)">
        <div class="form-group">
          <label for="loginUsuario">Código o Usuario</label>
          <input type="text" id="loginUsuario" placeholder="Ej. DIR-001, DOC-001 o EST-2026-001" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="Ingrese su contraseña" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>

      <div class="whatsapp-contact-box">
        <a
          href="https://wa.me/50233834646?text=Hola%2C%20deseo%20informaci%C3%B3n%20sobre%20COMPURED%20y%20Compucenter."
          target="_blank"
          rel="noopener noreferrer"
          class="btn-whatsapp-contacto"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.82 14.02c-.24.68-1.4 1.3-1.92 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.18-4.94-4.37-.15-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.59-.36.79-.36.2 0 .4 0 .57.01.18.01.43-.07.67.51.24.59.82 2.01.89 2.16.07.15.12.32.02.52-.1.2-.15.32-.29.49-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12 1 2.06 1.31 2.35 1.46.29.15.46.12.63-.07.17-.2.73-.85.92-1.14.2-.29.39-.24.66-.15.27.1 1.71.81 2 .95.29.15.49.22.56.34.07.12.07.7-.17 1.38z"/>
          </svg>
          <span>Contáctanos</span>
        </a>
      </div>
    </div>
  </div>

  <div id="loader" class="loader oculto"><div class="spinner"></div><p>Validando acceso...</p></div>

  <script src="api.js"></script>
  <script>
    async function iniciarSesionForm(e) {
      e.preventDefault();
      try {
        const usuario = document.getElementById("loginUsuario").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        const res = await llamarAPI("login", { usuario, password }, false);
        guardarSesion(res);
        if (res.rol === "Director") {
          window.location.href = "director.html";
        } else if (res.rol === "Docente") {
          window.location.href = "docente.html";
        } else {
          window.location.href = "estudiante.html";
        }
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
